---
# SPDX-License-Identifier: Apache-2.0
# SPDX-FileCopyrightText: 2026 The Linux Foundation

# maven-stage-prep-action
name: "📦 Maven Stage Prep"
description: "Prepare Maven project for staging release"

inputs:
  pom-file:
    description: "Path to root POM file"
    required: false
    default: "pom.xml"
  version-method:
    description: "Method to remove SNAPSHOT: sed or versions-plugin"
    required: false
    default: "sed"
  version-override:
    # yamllint disable-line rule:line-length
    description: "Release version for the versions-plugin method; empty removes -SNAPSHOT from the root POM's version"
    required: false
    default: ""
  project-name:
    description: "Project name for patch/bundle file naming"
    required: true
  gerrit-branch:
    description: "Branch name for git format-patch base ref"
    required: true
  java-version:
    description: "OpenJDK version (used only with versions-plugin method)"
    required: false
    default: "21"
  mvn-version:
    description: "Maven version (used only with versions-plugin method)"
    required: false
    default: "3.9.11"
  committer-name:
    description: "Git committer name for the release commit"
    required: false
    default: "LF Jenkins CI"
  committer-email:
    description: "Git committer email for the release commit"
    required: false
    default: "releng+release@linuxfoundation.org"

outputs:
  release_version:
    description: "De-SNAPSHOTted release version string"
    value: ${{ steps.prep.outputs.release_version }}
  patch_path:
    description: "Path to git format-patch file"
    value: ${{ steps.prep.outputs.patch_path }}
  bundle_path:
    description: "Path to git bundle file"
    value: ${{ steps.prep.outputs.bundle_path }}
  taglist_path:
    description: "Path to taglist.log file"
    value: ${{ steps.prep.outputs.taglist_path }}

runs:
  using: "composite"
  steps:
    - name: "Setup Java (versions-plugin only)"
      if: ${{ inputs.version-method == 'versions-plugin' }}
      # yamllint disable-line rule:line-length
      uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
      with:
        java-version: ${{ inputs.java-version }}
        distribution: "temurin"

    - name: "Setup Maven (versions-plugin only)"
      if: ${{ inputs.version-method == 'versions-plugin' }}
      # yamllint disable-line rule:line-length
      uses: s4u/setup-maven-action@4a02cbd99769e46198135c31d5097c94618ba3f5 # v1.21.0
      with:
        java-version: ${{ inputs.java-version }}
        maven-version: ${{ inputs.mvn-version }}
        checkout-enabled: false

    - name: "Prepare Maven staging release"
      id: prep
      shell: bash
      env:
        INPUT_POM_FILE: ${{ inputs.pom-file }}
        INPUT_VERSION_METHOD: ${{ inputs.version-method }}
        INPUT_VERSION_OVERRIDE: ${{ inputs.version-override }}
        INPUT_PROJECT_NAME: ${{ inputs.project-name }}
        INPUT_GERRIT_BRANCH: ${{ inputs.gerrit-branch }}
        INPUT_COMMITTER_NAME: ${{ inputs.committer-name }}
        INPUT_COMMITTER_EMAIL: ${{ inputs.committer-email }}
      # yamllint disable rule:line-length
      run: |
        # SPDX-License-Identifier: Apache-2.0
        set -euo pipefail

        echo "---> maven-stage-prep: Preparing Maven project for staging release"

        POM_FILE="${INPUT_POM_FILE}"
        VERSION_METHOD="${INPUT_VERSION_METHOD}"
        VERSION_OVERRIDE="${INPUT_VERSION_OVERRIDE}"
        PROJECT_NAME="${INPUT_PROJECT_NAME}"
        GERRIT_BRANCH="${INPUT_GERRIT_BRANCH}"

        PATCH_DIR="${GITHUB_WORKSPACE}/archives/patches"
        mkdir -p "$PATCH_DIR"

        # Step 1: Record commit hash for tagging (matches JJB taglist.log format)
        echo "${PROJECT_NAME} $(git rev-parse --verify HEAD)" \
            | tee -a "$PATCH_DIR/taglist.log"

        # Step 2: Remove -SNAPSHOT from version
        if [ "$VERSION_METHOD" = "versions-plugin" ]; then
            echo "INFO: Using Maven versions-plugin to update versions"
            # Each reactor module's own version, one per line, as Maven
            # resolves it, inheritance included. Fails when Maven does, so
            # a broken run cannot read as a reactor with nothing to set.
            reactor_versions() {
                local epom status=0
                epom="$(mktemp)"
                if mvn -B -q help:effective-pom -Doutput="$epom" \
                    -f "$POM_FILE" > /dev/null; then
                    python3 - "$epom" <<'PY' || status=1
        import sys
        import xml.etree.ElementTree as ET

        root = ET.parse(sys.argv[1]).getroot()
        for project in root.findall("{*}project") or [root]:
            print((project.findtext("{*}version") or "").strip())
        PY
                else
                    status=1
                fi
                rm -f -- "$epom"
                return "$status"
            }

            # versions:set needs -DnewVersion in batch mode, and Maven runs
            # in batch mode whenever CI is set, as on every runner. Without
            # an override, the release version is the root POM's own
            # version, as the sed method takes it. -B keeps a local run
            # from waiting on a prompt too.
            ROOT_VERSION=$(mvn -B help:evaluate \
                -Dexpression=project.version \
                -q -DforceStdout \
                -f "$POM_FILE")
            if [ -z "$VERSION_OVERRIDE" ]; then
                case "$ROOT_VERSION" in
                    *-SNAPSHOT) ;;
                    *)
                        echo "ERROR: $POM_FILE version '${ROOT_VERSION}' is not" \
                            "a SNAPSHOT; set version-override to release it" >&2
                        exit 1
                        ;;
                esac
            fi

            # First the root, as versions:set does by default: the root and
            # the modules inheriting its version, through any parent chain.
            # It also rewrites a CI-friendly ${revision} version, which
            # matching a version string cannot reach. version-override
            # applies here alone.
            if [ -n "$VERSION_OVERRIDE" ]; then
                NEW_VERSION="$VERSION_OVERRIDE"
            else
                NEW_VERSION="${ROOT_VERSION%-SNAPSHOT}"
            fi
            echo "INFO: Setting ${POM_FILE} version to ${NEW_VERSION}"
            mvn -B versions:set "-DnewVersion=${NEW_VERSION}" \
                versions:update-child-modules \
                versions:commit \
                -f "$POM_FILE"

            # Then every module that does not inherit the root's version: a
            # module of an aggregator that inherits from a parent module, or
            # one versioned on its own. Each distinct SNAPSHOT version left
            # is released by matching it exactly, so each module keeps its
            # own release number and references to it follow, while a
            # dependency outside the reactor stays as it is.
            # processAllModules is left off: it ignores the version match
            # and gives every module the root's version.
            ALL_VERSIONS=$(reactor_versions)
            mapfile -t VERSIONS < <(printf '%s\n' "$ALL_VERSIONS" \
                | grep -e '-SNAPSHOT$' | sort -u)
            for OLD_VERSION in "${VERSIONS[@]}"; do
                NEW_VERSION="${OLD_VERSION%-SNAPSHOT}"
                echo "INFO: Setting modules at ${OLD_VERSION} to ${NEW_VERSION}"
                mvn -B versions:set \
                    -DgroupId='*' -DartifactId='*' \
                    "-DoldVersion=${OLD_VERSION}" \
                    "-DnewVersion=${NEW_VERSION}" \
                    -DgenerateBackupPoms=false \
                    -f "$POM_FILE"
            done

            # A module the steps above missed would otherwise go into the
            # release commit as a SNAPSHOT without failing anything.
            ALL_VERSIONS=$(reactor_versions)
            REMAINING=$(printf '%s\n' "$ALL_VERSIONS" \
                | grep -e '-SNAPSHOT$' | sort -u | tr '\n' ' ') || true
            if [ -n "$REMAINING" ]; then
                echo "ERROR: reactor modules still at ${REMAINING}after" \
                    "versions:set" >&2
                exit 1
            fi
        else
            echo "INFO: Using sed to strip -SNAPSHOT from POM files"
            find . -name "*.xml" -print0 | xargs -0 sed -i 's/-SNAPSHOT//g'
        fi

        # Step 3: Extract release version from POM
        RELEASE_VERSION=""
        if command -v mvn &>/dev/null; then
            RELEASE_VERSION=$(mvn help:evaluate \
                -Dexpression=project.version \
                -q -DforceStdout \
                -f "$POM_FILE" 2>/dev/null) || true
        fi
        if [ -z "$RELEASE_VERSION" ]; then
            RELEASE_VERSION=$(grep -m1 '<version>' "$POM_FILE" \
                | sed 's/.*<version>\(.*\)<\/version>.*/\1/')
        fi
        echo "INFO: Release version: $RELEASE_VERSION"

        # Step 4: Git commit the de-SNAPSHOTted POMs
        git config user.email "${INPUT_COMMITTER_EMAIL}"
        git config user.name "${INPUT_COMMITTER_NAME}"
        git commit -am "Release ${PROJECT_NAME} ${RELEASE_VERSION}"

        # Step 5: Create format-patch and bundle
        SAFE_NAME="${PROJECT_NAME//\//-}"
        git format-patch --stdout "origin/${GERRIT_BRANCH}" \
            > "$PATCH_DIR/${SAFE_NAME}.patch"
        git bundle create "$PATCH_DIR/${SAFE_NAME}.bundle" \
            "origin/${GERRIT_BRANCH}..HEAD"

        # Step 6: Set outputs
        echo "release_version=${RELEASE_VERSION}" >> "$GITHUB_OUTPUT"
        echo "patch_path=${PATCH_DIR}/${SAFE_NAME}.patch" >> "$GITHUB_OUTPUT"
        echo "bundle_path=${PATCH_DIR}/${SAFE_NAME}.bundle" >> "$GITHUB_OUTPUT"
        echo "taglist_path=${PATCH_DIR}/taglist.log" >> "$GITHUB_OUTPUT"

        # Step 7: Summary
        {
            echo "## Maven Stage Prep ✅"
            echo ""
            echo "| | |"
            echo "|---|---|"
            echo "| **Project** | ${PROJECT_NAME} |"
            echo "| **Version** | ${RELEASE_VERSION} |"
            echo "| **Method** | ${VERSION_METHOD} |"
            echo "| **Branch** | ${GERRIT_BRANCH} |"
        } >> "$GITHUB_STEP_SUMMARY"
      # yamllint enable rule:line-length

branding:
  icon: "package"
  color: "blue"
