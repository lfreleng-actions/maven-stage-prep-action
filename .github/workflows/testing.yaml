---
# SPDX-License-Identifier: Apache-2.0
# SPDX-FileCopyrightText: 2026 The Linux Foundation

name: "🧪 Testing"

# yamllint disable-line rule:truthy
on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-sed-method:
    name: "Test sed method"
    permissions:
      contents: read
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      # Harden the runner used by this workflow
      # yamllint disable-line rule:line-length
      - uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      # yamllint disable-line rule:line-length
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: "Create test Maven project"
        shell: bash
        run: |
          # Create a test POM with SNAPSHOT version
          cat > pom.xml << 'POMEOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <project xmlns="http://maven.apache.org/POM/4.0.0"
                   xmlns:xsi="http://www.w3.org/2001/XMLSchema-instance"
                   xsi:schemaLocation="http://maven.apache.org/POM/4.0.0
                   http://maven.apache.org/xsd/maven-4.0.0.xsd">
              <modelVersion>4.0.0</modelVersion>
              <groupId>org.example</groupId>
              <artifactId>test-project</artifactId>
              <version>1.2.3-SNAPSHOT</version>
              <packaging>jar</packaging>
          </project>
          POMEOF
          git config user.email "ci-test@example.org"
          git config user.name "CI Test"
          # The action diffs against origin/<gerrit-branch>; make it resolvable
          # in this self-contained fixture by pointing it at the current HEAD.
          git update-ref refs/remotes/origin/main HEAD
          git add pom.xml
          git commit -m "Add test POM"

      - name: "Run maven-stage-prep (sed method)"
        id: stage-prep
        uses: $/
        with:
          project-name: "test-project"
          gerrit-branch: "main"
          version-method: "sed"

      - name: "Verify outputs"
        shell: bash
        # yamllint disable rule:line-length
        run: |
          echo "Release version: ${STEPS_STAGE_PREP_OUTPUTS_RELEASE_VERSION}"
          echo "Patch path: ${STEPS_STAGE_PREP_OUTPUTS_PATCH_PATH}"
          echo "Bundle path: ${STEPS_STAGE_PREP_OUTPUTS_BUNDLE_PATH}"
          echo "Taglist path: ${STEPS_STAGE_PREP_OUTPUTS_TAGLIST_PATH}"

          # Verify SNAPSHOT was removed
          if grep -q "SNAPSHOT" pom.xml; then
              echo "ERROR: SNAPSHOT still found in pom.xml"
              exit 1
          fi
          echo "✅ SNAPSHOT successfully removed from pom.xml"

          # Verify release version output
          if [ -z "${STEPS_STAGE_PREP_OUTPUTS_RELEASE_VERSION}" ]; then
              echo "ERROR: release_version output is empty"
              exit 1
          fi
          echo "✅ Release version output set: ${STEPS_STAGE_PREP_OUTPUTS_RELEASE_VERSION}"

          # Verify patch file exists
          if [ ! -f "${STEPS_STAGE_PREP_OUTPUTS_PATCH_PATH}" ]; then
              echo "ERROR: Patch file not found"
              exit 1
          fi
          echo "✅ Patch file created"

          # Verify bundle file exists
          if [ ! -f "${STEPS_STAGE_PREP_OUTPUTS_BUNDLE_PATH}" ]; then
              echo "ERROR: Bundle file not found"
              exit 1
          fi
          echo "✅ Bundle file created"

          # Verify taglist file exists
          if [ ! -f "${STEPS_STAGE_PREP_OUTPUTS_TAGLIST_PATH}" ]; then
              echo "ERROR: Taglist file not found"
              exit 1
          fi
          echo "✅ Taglist file created"

          echo "All tests passed! ✅"
        env:
          STEPS_STAGE_PREP_OUTPUTS_RELEASE_VERSION: ${{ steps.stage-prep.outputs.release_version }}
          STEPS_STAGE_PREP_OUTPUTS_PATCH_PATH: ${{ steps.stage-prep.outputs.patch_path }}
          STEPS_STAGE_PREP_OUTPUTS_BUNDLE_PATH: ${{ steps.stage-prep.outputs.bundle_path }}
          STEPS_STAGE_PREP_OUTPUTS_TAGLIST_PATH: ${{ steps.stage-prep.outputs.taglist_path }}
          # yamllint enable rule:line-length

  # The versions-plugin method on Maven reactors. A runner sets CI, so
  # Maven runs in batch mode and versions:set cannot prompt for the
  # version: each case must work without one. The action runs in the
  # workspace root, so each fixture becomes the repository there, and
  # this repository's checkout sits beside it, excluded.
  test-versions-plugin-method:
    name: "Test versions-plugin method (${{ matrix.case }})"
    permissions:
      contents: read
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          # No override: the release version comes from the root POM
          - case: "inherited"
            fixture: "inherited"
            override: ""
            outcome: "success"
            release: "1.2.3"
            expect: "pom.xml=1.2.3 module/pom.xml=1.2.3"
          - case: "inherited, override"
            fixture: "inherited"
            override: "2.0.0"
            outcome: "success"
            release: "2.0.0"
            expect: "pom.xml=2.0.0 module/pom.xml=2.0.0"
          # Nothing to de-SNAPSHOT, and no version to release instead
          - case: "released, no override"
            fixture: "released"
            override: ""
            outcome: "failure"
            release: ""
            expect: ""
          # The modules inherit from a parent module, not the root, so
          # setting the root's version alone leaves them SNAPSHOTs
          - case: "aggregator"
            fixture: "aggregator"
            override: ""
            outcome: "success"
            release: "1.0.0"
            expect: >-
              pom.xml=1.0.0 parent/pom.xml=1.0.0 core/pom.xml=1.0.0
              app/pom.xml=1.0.0
          - case: "aggregator, override"
            fixture: "aggregator"
            override: "2.0.0"
            outcome: "success"
            release: "2.0.0"
            # The override is the root's release; modules that do not
            # inherit the root's version release at their own
            expect: >-
              pom.xml=2.0.0 parent/pom.xml=1.0.0 core/pom.xml=1.0.0
              app/pom.xml=1.0.0
          # Each module releases at its own version, a reference to
          # one follows it, and an artifact outside the reactor at the
          # same SNAPSHOT version stays as it is
          - case: "independent"
            fixture: "independent"
            override: ""
            outcome: "success"
            release: "1.0.0"
            expect: >-
              pom.xml=1.0.0 a/pom.xml=2.3.0 b/pom.xml=0.5.0
              c/pom.xml=1.0.0
              b/pom.xml@org.example.stage:independent-a=2.3.0
              b/pom.xml@org.example.external:external=2.3.0-SNAPSHOT
          # The override names the root's release. The modules keep
          # their own, c included, though it shares the root's version
          - case: "independent, override"
            fixture: "independent"
            override: "9.0.0"
            outcome: "success"
            release: "9.0.0"
            expect: >-
              pom.xml=9.0.0 a/pom.xml=2.3.0 b/pom.xml=0.5.0
              c/pom.xml=1.0.0
              b/pom.xml@org.example.stage:independent-a=2.3.0
              b/pom.xml@org.example.external:external=2.3.0-SNAPSHOT
          # A ${revision}${changelist} version, which versions:set on
          # the root rewrites to the release
          - case: "CI-friendly"
            fixture: "cifriendly"
            override: ""
            outcome: "success"
            release: "1.4.0"
            expect: "pom.xml=1.4.0 module/pom.xml=1.4.0"
          - case: "CI-friendly, override"
            fixture: "cifriendly"
            override: "2.0.0"
            outcome: "success"
            release: "2.0.0"
            expect: "pom.xml=2.0.0 module/pom.xml=2.0.0"
    steps:
      # yamllint disable-line rule:line-length
      - uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      # yamllint disable-line rule:line-length
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          path: "action-src"

      - name: "Commit the fixture as the project"
        shell: bash
        env:
          FIXTURE: action-src/tests/fixtures/${{ matrix.fixture }}
        run: bash action-src/tests/init-fixture.sh "${FIXTURE}" action-src

      - name: "Run maven-stage-prep (versions-plugin method)"
        id: stage-prep
        continue-on-error: ${{ matrix.outcome == 'failure' }}
        uses: $/
        with:
          project-name: "test-project"
          gerrit-branch: "main"
          version-method: "versions-plugin"
          version-override: ${{ matrix.override }}

      - name: "Check the outcome"
        shell: bash
        env:
          WANT: ${{ matrix.outcome }}
          GOT: ${{ steps.stage-prep.outcome }}
        run: |
          if [ "${GOT}" != "${WANT}" ]; then
            echo "::error::the action's outcome was ${GOT}, expected ${WANT}"
            exit 1
          fi
          echo "Outcome ${GOT} ✅"

      - name: "Check the released versions"
        if: matrix.outcome == 'success'
        shell: bash
        env:
          EXPECT: ${{ matrix.expect }}
          WANT_RELEASE: ${{ matrix.release }}
          RELEASE: ${{ steps.stage-prep.outputs.release_version }}
          PATCH: ${{ steps.stage-prep.outputs.patch_path }}
        run: |
          set -euo pipefail
          status=0
          # shellcheck disable=SC2086  # one argument per expectation
          bash action-src/tests/check-versions.sh . ${EXPECT} || status=1
          if [ "${RELEASE}" != "${WANT_RELEASE}" ]; then
            echo "::error::release_version '${RELEASE}', expected" \
              "'${WANT_RELEASE}'"
            status=1
          fi
          # The release commit must carry the POM changes, which the
          # patch handed to the stage job holds.
          if ! grep -q "^Subject: .*Release test-project ${WANT_RELEASE}\$" \
            "${PATCH}"; then
            echo "::error::the patch holds no release commit"
            status=1
          fi
          exit "${status}"
